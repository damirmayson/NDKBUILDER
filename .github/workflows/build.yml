name: Build JNI plugin

on:
  repository_dispatch:
    types: [build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория (скелет проекта: Android.mk, vendor/Dobby и т.д.)
        uses: actions/checkout@v4

      - name: Скачать NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d $HOME
          echo "NDK_HOME=$HOME/android-ndk-r25c" >> $GITHUB_ENV

      - name: Скачать и наложить .cpp файлы пользователя поверх jni/
        env:
          ARCHIVE_URL: ${{ github.event.client_payload.archive_url }}
        run: |
          curl -L "$ARCHIVE_URL" -o source.zip
          # -o перезаписывает совпадающие файлы, остальной скелет (vendor/Dobby и т.п.) остаётся нетронутым
          unzip -o -q source.zip -d jni

      - name: Собрать ndk-build
        run: |
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/jni/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/jni/Application.mk" \
            -j4

      - name: Упаковать libs.zip
        run: |
          cd libs
          zip -r "$GITHUB_WORKSPACE/libs.zip" armeabi-v7a arm64-v8a

      - name: Отправить результат в Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -F document=@libs.zip \
               -F chat_id="$CHAT_ID" \
               -F caption="Сборка готова: libplugin.so для armeabi-v7a и arm64-v8a" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

      - name: Уведомить об ошибке (если сборка упала)
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -F chat_id="$CHAT_ID" \
               -F text="Сборка не удалась. Проверьте .cpp файлы в архиве и логи в GitHub Actions." \
               "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "android_mk=$ANDROID_MK" >> "$GITHUB_OUTPUT"
          echo "jni_dir=$JNI_DIR" >> "$GITHUB_OUTPUT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "application_mk=$APPLICATION_MK" >> "$GITHUB_OUTPUT"

          echo "Найден Android.mk: $ANDROID_MK"
          echo "jni/: $JNI_DIR"
          echo "Корень проекта: $PROJECT_ROOT"
          echo "Application.mk: ${APPLICATION_MK:-не найден, соберётся с настройками по умолчанию}"

      - name: Notify Android.mk not found
        if: steps.locate.outputs.found == 'false'
        run: |
          curl -s -F chat_id="${{ github.event.inputs.chat_id }}" \
               -F text="В архиве не найден jni/Android.mk. Проверь, что .zip содержит папку jni с Android.mk внутри." \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"

      - name: Validate LOCAL_SRC_FILES exist
        id: validate
        if: steps.locate.outputs.found == 'true'
        run: |
          ANDROID_MK="${{ steps.locate.outputs.android_mk }}"
          JNI_DIR="${{ steps.locate.outputs.jni_dir }}"

          # склеиваем строки с переносом "\" в одну, чтобы не терять
          # многострочные LOCAL_SRC_FILES := a.cpp \  b.cpp \  ...
          sed ':a;N;$!ba;s/\\\n[ \t]*/ /g' "$ANDROID_MK" > /tmp/android_mk_flat.txt

          SRC_FILES=$(grep -E '^[[:space:]]*LOCAL_SRC_FILES[[:space:]]*(:=|\+=)' /tmp/android_mk_flat.txt \
            | grep -oE '[A-Za-z0-9_./-]+\.(cpp|cc|cxx|c)\b' || true)

          if [ -z "$SRC_FILES" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "missing=не удалось прочитать LOCAL_SRC_FILES из Android.mk" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MISSING=""
          for f in $SRC_FILES; do
            if [ ! -f "$JNI_DIR/$f" ]; then
              MISSING="$MISSING $f"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify missing source files
        if: steps.locate.outputs.found == 'true' && steps.validate.outputs.ok == 'false'
        run: |
          curl -s -F chat_id="${{ github.event.inputs.chat_id }}" \
               -F text="В Android.mk указаны файлы, которых нет в jni/: ${{ steps.validate.outputs.missing }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"

      - name: Set up NDK
        if: steps.locate.outputs.found == 'true' && steps.validate.outputs.ok == 'true'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Run ndk-build
        id: build
        if: steps.locate.outputs.found == 'true' && steps.validate.outputs.ok == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          PROJECT_ROOT: ${{ steps.locate.outputs.project_root }}
          ANDROID_MK: ${{ steps.locate.outputs.android_mk }}
          APPLICATION_MK: ${{ steps.locate.outputs.application_mk }}
        run: |
          ARGS=(NDK_PROJECT_PATH="$PROJECT_ROOT" APP_BUILD_SCRIPT="$ANDROID_MK" -j"$(nproc)")
          if [ -n "$APPLICATION_MK" ]; then
            ARGS+=(NDK_APPLICATION_MK="$APPLICATION_MK")
          fi
          "$ANDROID_NDK_HOME/ndk-build" "${ARGS[@]}"

      - name: Collect .so files
        id: collect
        if: steps.locate.outputs.found == 'true' && steps.validate.outputs.ok == 'true'
        env:
          PROJECT_ROOT: ${{ steps.locate.outputs.project_root }}
        run: |
          mkdir -p /tmp/out
          # Копируем с сохранением структуры libs/<abi>/libplugin.so,
          # иначе одинаковые имена файлов из разных ABI затирают друг друга.
          find "$PROJECT_ROOT/libs" -mindepth 2 -name "*.so" | while read -r f; do
            abi_dir="/tmp/out/$(basename "$(dirname "$f")")"
            mkdir -p "$abi_dir"
            cp "$f" "$abi_dir/"
          done
          cd /tmp/out
          if [ -z "$(ls -A .)" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            zip -r /tmp/result.zip .
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact (backup)
        if: steps.collect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: built-so
          path: /tmp/out/*.so

      - name: Send result to Telegram (success)
        if: success() && steps.collect.outputs.found == 'true'
        run: |
          curl -s -F chat_id="${{ github.event.inputs.chat_id }}" \
               -F document=@/tmp/result.zip \
               -F caption="Сборка готова ✅" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"

      - name: Notify no .so found
        if: success() && steps.locate.outputs.found == 'true' && steps.validate.outputs.ok == 'true' && steps.collect.outputs.found == 'false'
        run: |
          curl -s -F chat_id="${{ github.event.inputs.chat_id }}" \
               -F text="Сборка прошла, но .so файлы не найдены в libs/. Проверь Android.mk/Application.mk." \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -F chat_id="${{ github.event.inputs.chat_id }}" \
               -F text="Сборка упала ❌. Смотри лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"
